name: Benchmark

# Manual only (spec 015): full benchmark runs happen locally (`python tests/bench/run.py --suite ...`),
# so they never spend the owner's CI minutes. This workflow is kept for a deliberate, manual run of
# the CI-scope suite: bbob-mixint D=10 and PBO n=64, instances 1-5, budget 100 x D, sharded by
# optimiser x suite x instance (70 jobs). Never add a pull_request, push or schedule trigger.
on:
  workflow_dispatch:

permissions:
  contents: read

env: # one BLAS/OpenMP thread per worker process
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        optimiser: [geneopt, random, pygad, deap, pymoo, optuna, nevergrad]
        suite: [mixint, pbo]
        instance: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . -r tests/bench/requirements.txt
      - run: python -m pytest -q --bench tests/test_bench.py tests/test_bench_suites.py tests/test_bench_score.py
        if: matrix.optimiser == 'geneopt' && matrix.suite == 'mixint' && matrix.instance == 1
      # a shard holds one optimiser, so its own gate can't fail; the report job judges the merge
      - run: >-
          python tests/bench/run.py --suite ${{ matrix.suite }} --instances ${{ matrix.instance }}
          --only ${{ matrix.optimiser }} --out-dir results --jobs 4
      - uses: actions/upload-artifact@v4
        with:
          name: records-${{ matrix.suite }}-${{ matrix.optimiser }}-${{ matrix.instance }}
          path: results

  report:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . -r tests/bench/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: records-*
          merge-multiple: true
          path: results
      # the exit code carries the spec 015 gate; report first, fail after posting
      - run: python tests/bench/run.py --report-only results --out bench.md || echo "GATE_FAILED=1" >> "$GITHUB_ENV"
      - run: cat bench.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: bench-report
          path: |
            bench.md
            results
      - if: env.GATE_FAILED == '1'
        run: |
          echo "::error::The main GeneOpt row failed the spec 015 gate against random search"
          exit 1
