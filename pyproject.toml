[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "GeneOpt"
dynamic = ["version"]
description = "Genetic-algorithm optimisation over discrete search spaces, with caching and plots"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Erfan Mahdavi Athar", email = "erfan.mh.at@gmail.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
plots = ["matplotlib>=3.7", "pandas>=2.0"]
analysis = ["GeneOpt[plots]", "catboost>=1.2"]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6", "ruff>=0.6", "mypy>=1.10"]

[project.urls]
Source = "https://github.com/erfanmhat/GeneOpt"

[tool.hatch.version]
path = "geneopt/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["geneopt"]

[tool.hatch.build.targets.sdist]
include = ["geneopt", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
markers = [
    "plots: needs the plots/analysis extras (pandas, matplotlib, catboost)",
]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["specs"]  # spec code blocks are illustrative sketches, not source

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
files = ["geneopt"]
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["catboost", "catboost.*", "pandas", "pandas.*", "matplotlib", "matplotlib.*"]
ignore_missing_imports = true
